###########################
# Propriétés profil "dev" #
###########################

spring.datasource.qualimarc.jdbcurl=
spring.datasource.qualimarc.username=
spring.datasource.qualimarc.password=
spring.datasource.qualimarc.driver-class-name=org.postgresql.Driver

spring.jpa.qualimarc.generate-ddl=true
spring.jpa.qualimarc.show-sql=false
spring.jpa.qualimarc.hibernate.ddl-auto=create
spring.sql.qualimarc.init.mode=always

spring.datasource.basexml.jdbcurl=
spring.datasource.basexml.username=
spring.datasource.basexml.password=
spring.datasource.basexml.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.basexml.generate-ddl=false
spring.jpa.basexml.show-sql=false
spring.jpa.basexml.properties.hibernate.dialect=fr.abes.qualimarc.core.configuration.OracleXmlDialect
spring.jpa.basexml.hibernate.ddl-auto=none
spring.jpa.basexml.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.sql.basexml.init.mode=never

# --- FIX incident TEST du 31/08/2026 : protection contre une base BaseXML muette ---
# qualimarc.basexml.connect-timeout : delai max (ms) d'etablissement d'une connexion Oracle.
# qualimarc.basexml.read-timeout : delai max (ms) de lecture d'une reponse Oracle, y compris
# la lecture du CLOB XML de la notice. Sans ces timeouts, un thread d'analyse reste bloque
# indefiniment quand l'Oracle ne repond plus, jusqu'a epuiser le pool asynchrone.
qualimarc.basexml.connect-timeout=10000
qualimarc.basexml.read-timeout=60000
# Hikari : attendre au maximum 10 s une connexion du pool avant d'echouer (defaut : 30 s).
spring.datasource.basexml.connection-timeout=10000
# Loguer toute connexion conservee plus de 2 minutes : symptome d'un thread bloque.
spring.datasource.basexml.leak-detection-threshold=120000
# Nombre maximal d'analyses simultanees : le pool compte 8 threads et chaque analyse en
# mobilise plusieurs. Au-dela de cette limite, les analyses s'affameraient entre elles ;
# les suivantes sont refusees proprement en HTTP 503.
qualimarc.analysis.max-concurrent=2
# Duree maximale d'une analyse (minutes) : au-dela, elle est declaree en echec au lieu de
# rester en memoire indefiniment.
qualimarc.analysis.timeout-minutes=30

jwt.anonymousUser=qualimarcUser
jwt.token=${JWT_TOKEN:${JWT_SECRET:}}

spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=AsyncThread-

# Spring
spring.main.banner-mode=off

# Configuration des logs
logging.level.root=INFO
logging.level.fr.abes=DEBUG
